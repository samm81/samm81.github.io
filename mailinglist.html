---
layout: default
---

<form class="pure-form pure-form-stacked" action="https://formspree.io/samwmaynard+bloglist@gmail.com" method="POST">
  <fieldset>
    <legend>
      it's just a list of emails I copy paste into bcc when I send out a
      notification of a new blog post. get added to the list below:
    </legend>
    <div class="pure-control-group">
      <input class="pure-input-1-3" name="name" type="text" placeholder="name" />
    </div>

    <div class="pure-control-group">
      <input class="pure-input-1-3" name="email" type="email" placeholder="email" />
    </div>

    <input type="hidden" name="_next" value="/" />

    <div class="pure-controls">
      <button type="submit" value="Send" class="pure-button pure-button-primary">
        I'm on the list
      </button>
    </div>
  </fieldset>
</form>
